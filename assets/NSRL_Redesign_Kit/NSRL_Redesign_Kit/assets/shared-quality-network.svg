<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="nt nd"><title id="nt">Seven divisions, one shared quality system</title><desc id="nd">A conceptual relationship map. The divisions connect to the same test-item record, quality system and archive. This is not a fixed sequence of study stages.</desc><style>.link{stroke:#B6C9C5;stroke-width:1.4;fill:none}.node{fill:#fff;stroke:#D8E2DE}.name{font:15px system-ui;fill:#10263B}.label{font:11px system-ui;letter-spacing:1.5px;fill:#187A72}.core{fill:#10263B}.pulse{fill:none;stroke:#187A72;stroke-width:2;transform-origin:400px 280px;opacity:.4}@keyframes breathe{50%{opacity:.2;transform:scale(1.07)}}@media(prefers-reduced-motion:reduce){.pulse{animation:none}}</style><rect width="800" height="580" rx="24" fill="#F2F5F0"/><path class="link" d="M400 280 Q400 100 180 100"/><path class="link" d="M400 280 Q400 70 400 70"/><path class="link" d="M400 280 Q400 100 620 100"/><path class="link" d="M400 280 Q400 300 660 300"/><path class="link" d="M400 280 Q400 470 540 470"/><path class="link" d="M400 280 Q400 470 260 470"/><path class="link" d="M400 280 Q400 300 140 300"/><circle cx="400" cy="280" r="83" class="pulse"/><circle cx="400" cy="280" r="73" class="core"/><text x="400" y="268" text-anchor="middle" fill="white" font-family="system-ui" font-size="17">One shared</text><text x="400" y="292" text-anchor="middle" fill="white" font-family="system-ui" font-size="17">quality system</text><text x="400" y="317" text-anchor="middle" fill="#B6D6CE" font-family="system-ui" font-size="10">RECORD · ARCHIVE</text><rect class="node" x="94" y="70" width="172" height="60" rx="12"/><circle cx="115" cy="100" r="4" fill="#187A72"/><text class="name" x="184" y="105" text-anchor="middle">Toxicology</text><rect class="node" x="314" y="40" width="172" height="60" rx="12"/><circle cx="335" cy="70" r="4" fill="#187A72"/><text class="name" x="404" y="75" text-anchor="middle">Ecotoxicology</text><rect class="node" x="534" y="70" width="172" height="60" rx="12"/><circle cx="555" cy="100" r="4" fill="#187A72"/><text class="name" x="624" y="105" text-anchor="middle">Chemistry</text><rect class="node" x="574" y="270" width="172" height="60" rx="12"/><circle cx="595" cy="300" r="4" fill="#187A72"/><text class="name" x="664" y="305" text-anchor="middle">Microbiology</text><rect class="node" x="454" y="440" width="172" height="60" rx="12"/><circle cx="475" cy="470" r="4" fill="#187A72"/><text class="name" x="544" y="475" text-anchor="middle">Entomology</text><rect class="node" x="174" y="440" width="172" height="60" rx="12"/><circle cx="195" cy="470" r="4" fill="#187A72"/><text class="name" x="264" y="475" text-anchor="middle">Vivarium</text><rect class="node" x="54" y="270" width="172" height="60" rx="12"/><circle cx="75" cy="300" r="4" fill="#187A72"/><text class="name" x="144" y="305" text-anchor="middle">Custom studies</text><text class="label" x="400" y="555" text-anchor="middle">CONCEPTUAL RELATIONSHIPS · STUDY SCOPE VARIES</text></svg>
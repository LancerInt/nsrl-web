<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" role="img" aria-labelledby="tt td"><title id="tt">Illustrative analytical trace</title><desc id="td">An abstract chromatogram used as a decorative teaching motif, without numerical measurements or performance claims.</desc><style>.trace{fill:none;stroke:#187A72;stroke-width:3;stroke-linejoin:round;stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 2.2s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.trace{animation:none;stroke-dashoffset:0}}</style><rect width="680" height="310" rx="18" fill="#F2F5F0"/><path d="M48 55v190h590" stroke="#BCCBC8" fill="none"/><path class="trace" d="M48 244h58l8-8 8 8h50l8-27 8 27h45l13-160 13 160h52l12-90 12 90h39l9-35 9 35h47l16-117 16 117h100"/><text x="48" y="281" fill="#536B70" font-family="system-ui" font-size="11" letter-spacing="1.3">ILLUSTRATIVE TRACE · NO MEASURED DATA</text></svg>